# Mantém o Supabase (plano grátis) ativo. O Supabase pausa projetos com pouca atividade no banco na última
# semana: pela documentação, são precisas "algumas consultas ao banco TODOS OS DIAS". Por isso este
# despertador roda 4 vezes por dia e faz 3 leituras simples e públicas (as mesmas que o site faz), usando só a
# chave pública (publishable) que já está em js/config.js. Não grava nada.
# Para rodar na hora: GitHub › Actions › "Manter o Supabase ativo" › Run workflow.
name: Manter o Supabase ativo

on:
  schedule:
    - cron: "17 2,8,14,20 * * *"   # 4 vezes por dia (23:17, 05:17, 11:17 e 17:17 em Brasília)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  despertar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Ler a URL e a chave pública do site
        run: |
          URL=$(grep -oE 'https://[a-z0-9]+\.supabase\.co' js/config.js | head -1)
          KEY=$(grep -oE 'sb_publishable_[A-Za-z0-9_-]+' js/config.js | head -1)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Não achei a URL ou a chave em js/config.js"; exit 1; fi
          echo "URL=$URL" >> "$GITHUB_ENV"
          echo "KEY=$KEY" >> "$GITHUB_ENV"
      - name: Consultar o banco (só leitura)
        run: |
          consulta() {  # $1 = caminho; repete até 3 vezes se o banco não responder
            for tentativa in 1 2 3; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/$1" -H "apikey: $KEY" -H "Content-Type: application/json" ${2:+-X POST -d "$2"})
              echo "$1 -> HTTP $code (tentativa $tentativa)"
              if [ "$code" = "200" ]; then return 0; fi
              sleep 60
            done
            return 1
          }
          consulta "companies?select=id&limit=5" \
            && consulta "professionals?select=id&limit=5" \
            && consulta "rpc/promo_active" '{}' \
            && { echo "Supabase ativo."; exit 0; }
          echo "O Supabase não respondeu. Ele pode estar pausado: abra o painel e clique em Resume/Restore project."
          exit 1
